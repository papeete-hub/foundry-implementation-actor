# A USE's identity card — the one card that is this use's own.
#
# `name` and `description` belong to this instance; the other three cards are copied verbatim from
# the definition the package ships, and `foundry-implementation-actor lint` checks that they still
# match it. That is deliberate: a use answers the actor's doors, it does not redefine them.
manifest: papeete-actor-manifest/v0
name: ACME.PARTS.CAP.SUP.007.WID-implementation
description: >-
  Implements TASK-NNN cards for the fictional capability ACME.PARTS.CAP.SUP.007.WID, writing only
  under the components its sidecar declares, then pushing a branch and publishing one image per
  touched component. A worked example — see ../README.md.
