# THE BINDING. This one file is everything that ties the generic implementation actor to one
# capability. There is no subclass, no fork, and no code — a second capability instantiates the
# same actor by writing its own copy of this file.
#
# Read it in four parts:
#   capability / source_repo  the only two identifiers anyone writes. Every other rendering — the
#                             registry path, the image refs, the clone prefix, the commit identity
#                             — is DERIVED from them. Run `foundry-implementation-actor show .`
#                             to see all eight before spending a session.
#   registry_repo             the knowledge registry the ground_in fetches resolve through. No
#                             default exists: a fetch that silently reaches a fallback registry is
#                             worse than one that fails.
#   components                the units this actor may write to and publish. Their `path`s ARE the
#                             write boundary — a commit staging anything outside them is refused.
#   ground_in                 what the session is told BEFORE its first turn. Each entry is a
#                             command to run and a place to put its output inside the clone. A
#                             third knowledge source is an entry here, not a release of the
#                             package.
#
# ACME.PARTS.CAP.SUP.007.WID is fictional, and the `fetch:` argvs below are `printf` rather than
# real knowledge tools — so this example runs with no credentials and no network. A real use names
# its actual tools there and installs them in its image. Everything else is exactly what a real
# sidecar looks like; CI and the release workflow run their gates against this very folder, so it
# cannot quietly stop being valid. See ../README.md for the walkthrough.
context: foundry-implementation-actor/agentic-context/v1
engine: claude-code
capability: ACME.PARTS.CAP.SUP.007.WID
source_repo: acme-lab/ACME.PARTS.CAP.SUP.007.WID-implementation
registry_repo: acme-lab/acme-governance
components:
  - {name: backend, path: backend/, tests: backend/tests/, dockerfile: backend/deployment/local}
  - {name: stub,    path: stub/,    tests: stub/tests/,    dockerfile: stub/deployment/local}
ground_in:
  - name: business
    answers: the WHAT/WHY — domain vision, business events, ubiquitous language
    fetch: [printf, '{"probe": "business", "capability": "{capability}"}']
    into: .foundry/business.md
    load: eager
  - name: process
    answers: the HOW — aggregates, commands, policies, read-models, bus, api, JSON schemas
    fetch: [printf, '{"probe": "process"}']
    into: .foundry/process.md
    load: on-demand
