# THE DOORS. `synchronous-messaging-doors/v1` — one action that builds, one query that only
# answers.
#
# `engine: claude-code` is this actor kind's declared engine, on BOTH doors. A use's sidecar
# repeats it in its own `engine:` field, and the entrypoint registers the engine under exactly that
# key — so a use whose sidecar names a different engine is caught by its own card rather than at
# the first request. One engine instance serves both: `Actor.judge()` hands it the door id, and it
# dispatches on that.
#
# WHY `assess-task` IS A QUERY. An action is a promise to try; a query is a promise to answer, from
# this actor's own state and nothing invented. Assessing whether a proposed acceptance surface can
# be delivered changes nothing — no branch, no commit, no image — and placing it under `queries:`
# makes that structural rather than merely promised. It is also why it registers no handler: with
# an engine and no handler, `Actor.receive()` returns the judged dict as the reply, and there is no
# deterministic half here because there is nothing to contain. See ADR-FIA-0004.
manifest: synchronous-messaging-doors/v1
actions:
  - id: implement-task
    means: >-
      the door for "implement TASK-NNN for the capability I serve". Send it here with the task id,
      title, definition of done, and (optionally) context and remediation_context — the caller
      supplies everything, no task card is looked up here. I clone my capability's repository into
      my own private copy, ground myself in that capability's own standing context, judge how to
      implement the task (writing only under whichever of my declared components it touches), then
      commit and push to impl/TASK-NNN, and build each touched component's image in the cluster's
      shared buildkit and push it to the registry, named and versioned by convention. If an
      `acceptance_surface` was agreed at my assess-task door first, send it too and I build
      against it rather than against the definition of done alone. I never open a pull request —
      an orchestrating actor does, once a testing actor also confirms.
    completion: whether I accepted, pushed, and published images (with the branch and image refs), or refused, and why.
    door_schema: implement-task-cmd
    completion_schema: [task-implemented-result, task-refused-result]
    engine: claude-code

queries:
  - id: assess-task
    means: >-
      the door for "here is what the testing actor intends to assert about TASK-NNN — can you
      deliver it?", asked BEFORE anything is built. Send the task id, title, definition of done,
      optional context, and the proposed `acceptance_surface`: a list of expectations, each an
      object carrying at least `id` (stable, and what a later verdict names), `statement` (what
      must hold), and `handle` (how a black-box caller reaches it — the component, the endpoint,
      the event routing key, the environment variable its base URL arrives in). I clone my
      capability's repository read-only, ground myself in its own standing context, and judge each
      expectation against what is already there. I write nothing, build nothing, and publish
      nothing.
    completion: >-
      whether the whole surface is feasible; for each expectation I cannot meet, an objection
      naming its `id`, whether it cannot be built at all, is not determined by the task, or
      contradicts the capability's own contract, and a counter-proposal where I have one; and for
      the expectations I accept that need something fixed for a test to address them, the
      commitments I undertake to pin. A disagreement here is an answer, not a refusal — it is the
      caller's move, and it is meant to reach a human rather than a session.
    door_schema: assess-task-cmd
    completion_schema: task-assessed-result
    engine: claude-code
