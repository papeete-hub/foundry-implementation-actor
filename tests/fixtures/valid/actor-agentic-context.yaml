# A fictional capability, used by the CI and release gates that run against the INSTALLED WHEEL.
#
# It exists so those gates need no tool installed and no network: both `fetch:` argvs below are
# `printf`, so the wheel's own grounding path can be exercised end to end — fetch, write the
# envelope into a clone, render the CLAUDE.md, resolve its @-imports — in a scratch venv that has
# nothing but this package.
#
# ACME.PARTS.CAP.SUP.007.WID is not any real capability in any real instance. See
# tests/conftest.py for why the fixtures are fictional.
context: foundry-implementation-actor/agentic-context/v1
engine: claude-code
capability: ACME.PARTS.CAP.SUP.007.WID
source_repo: acme-lab/ACME.PARTS.CAP.SUP.007.WID-implementation
registry_repo: acme-lab/acme-governance
components:
  - {name: backend, path: backend/, tests: backend/tests/, dockerfile: backend/deployment/local}
  - {name: stub,    path: stub/,    tests: stub/tests/,    dockerfile: stub/deployment/local}
ground_in:
  - name: business
    answers: the WHAT/WHY — domain vision, business events, ubiquitous language
    fetch: [printf, '{"probe": "business", "capability": "{capability}"}']
    into: .foundry/business.md
    load: eager
  - name: process
    answers: the HOW — aggregates, commands, policies, read-models, bus, api, JSON schemas
    fetch: [printf, '{"probe": "process"}']
    into: .foundry/process.md
    load: on-demand
