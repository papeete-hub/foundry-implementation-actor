# WHAT DATA EXISTS. `papeete-actor-data/v0`, owned by `papeete-actor-message` — a named, minimally
# typed dictionary. Every field here belongs to the ACTOR, not to any capability: a task id, the
# caller's statement of the task, and what came back. Nothing names a capability, a component or a
# knowledge tool, because none of those are known until a sidecar supplies them.
data: papeete-actor-data/v0
items:
  - name: task_id
    type: string
    description: the TASK-NNN card id this actor was asked about (e.g. "TASK-009")
  - name: title
    type: string
    description: the task's short title/summary, supplied by the caller — no card lookup is performed here
  - name: context
    type: string
    description: free-text elaboration beyond the title — background, constraints, links; optional
  - name: definition_of_done
    type: list
    description: the acceptance criteria this task must satisfy, as the caller states them
  - name: remediation_context
    type: string
    description: >-
      on a retry, the prior attempt's failing test criteria — what the implementing session should
      fix this time; optional, absent on a first attempt
  - name: acceptance_surface
    type: list
    description: >-
      the observable expectations this increment must satisfy, each with a stable id, what must
      hold, and the handle a black-box caller reaches it through — proposed by the testing actor
      before anything is built, and agreed here. The dictionary types it as a list and stops
      there, the way definition_of_done is a list of strings: the entry shape is written down in
      the assess-task door's own means, not checked by this card
  - name: feasible
    type: boolean
    description: >-
      whether this actor can deliver the acceptance_surface it was asked to assess. False is an
      ANSWER, not a refusal — the objections say what is wrong, and it is the caller's move
  - name: objections
    type: list
    description: >-
      one entry per expectation this actor cannot meet, naming the expectation's own id, why
      (it cannot be built, the task does not determine it, or it contradicts the capability's
      contract) and a counter-proposal where there is one; absent when everything was agreed
  - name: commitments
    type: list
    description: >-
      what this actor undertakes to pin for the expectations it agreed to, where agreeing is not
      enough on its own — the exact fixture ids, endpoint path or event routing key a black-box
      test will address. Made BEFORE anything is built, so it is a promise, not a report of what
      was found afterwards; absent when nothing needed pinning
  - name: accepted
    type: boolean
    description: whether the implement-task request was accepted, pushed, and its images published
  - name: because
    type: string
    description: why a request was refused (containment violation, nothing staged, ...)
  - name: branch
    type: string
    description: the branch the implementation was pushed to (impl/TASK-NNN)
  - name: images
    type: list
    description: >-
      the full name:version ref of each touched component's published image (e.g.
      "acme.parts.cap.sup.007.wid-backend:0.1.0-TASK-011-a1b2c3d"), by convention — no other actor
      is ever told these tags explicitly
